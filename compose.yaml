# Local development database. Run with `npm run db:up` (stop with `npm run db:down`).
# Credentials here must match DATABASE_URL in .env.local / .env.example.
services:
  db:
    image: postgres:17-alpine
    container_name: moviemania-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviemania
      POSTGRES_PASSWORD: moviemania
      POSTGRES_DB: moviemania
    # Host port 5455 (not the default 5432) to avoid clashing with other local
    # Postgres instances. Format is HOST:CONTAINER — Postgres always listens on
    # 5432 inside the container. Update DATABASE_URL to match the host port.
    ports:
      - "5455:5432"
    volumes:
      - moviemania_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviemania -d moviemania"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  moviemania_pgdata:
